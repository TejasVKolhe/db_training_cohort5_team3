# =============================================================================
# TICKET-ADV049 — dev profile: PostgreSQL + Kafka can be disabled if not running
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reconx
    username: reconx_user
    password: reconx_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      missing-topics-fatal: false   # don't blow up if Kafka isn't running locally

logging:
  level:
    com.dbtraining.reconx: DEBUG